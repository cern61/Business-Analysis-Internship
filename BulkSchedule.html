];
const NAME_SUFFIXES = [
  "Residence","Clinic","Apartments","Family Home","Office","Plaza","Mall","Towers","Hospital","School",
  "Hotel","Warehouse","Complex","Center","Building","Park","Villa","Estate","Store","Studio"
];

const REGIONS = ["North","Central","South","East","West"];

function pad(n) { return String(n).padStart(2, "0"); }
function seededRand(seed) {
  let x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}
function fmtDate(d) {
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

const REFERENCE_DATE = new Date(2026, 5, 11); // Jun 11, 2026

function generateClients(n) {
  const list = [];
  for (let i = 0; i < n; i++) {
    const r1 = seededRand(i * 12.9898);
    const r2 = seededRand(i * 78.233 + 1);
    const r3 = seededRand(i * 37.719 + 2);
    const r4 = seededRand(i * 91.345 + 3);
    const prefix = NAME_PREFIXES[Math.floor(r1 * NAME_PREFIXES.length)];
    const suffix = NAME_SUFFIXES[Math.floor(r2 * NAME_SUFFIXES.length)];
    const service = SERVICES[Math.floor(r3 * SERVICES.length)];
    const region = REGIONS[Math.floor(r4 * REGIONS.length)];
    const equipment = EQUIPMENT[Math.floor(seededRand(i * 15.5) * EQUIPMENT.length)];
    const status = seededRand(i * 3.14 + 5) > 0.22 ? "Unscheduled" : "Scheduled";
    const daysAgo = Math.floor(seededRand(i * 7.77 + 9) * 45);
    const created = new Date(REFERENCE_DATE);
    created.setDate(created.getDate() - daysAgo);
    list.push({
      id: "c" + (i + 1),
      name: prefix + " " + suffix,
      equipment,
      code: "C-" + (200 + i),
      service,
      region,
      status,
      createdISO: created.toISOString().slice(0, 10),
      created: fmtDate(created),
      daysAgo,
    });
  }
  return list;
}

function generateJobs(n) {
  const list = [];
  for (let i = 0; i < n; i++) {
    const r1 = seededRand(i * 21.17 + 11);
    const r2 = seededRand(i * 63.29 + 12);
    const r3 = seededRand(i * 44.71 + 13);
    const r4 = seededRand(i * 88.13 + 14);
    const r5 = seededRand(i * 17.31 + 15);
    const r6 = seededRand(i * 3.3 + 16);
    const r7 = seededRand(i * 5.55 + 17);
    const r8 = seededRand(i * 9.09 + 18);
    const prefix = NAME_PREFIXES[Math.floor(r1 * NAME_PREFIXES.length)];
    const suffix = NAME_SUFFIXES[Math.floor(r2 * NAME_SUFFIXES.length)];
    const jobType = r3 > 0.9 ? "Emergency" : JOB_TYPES[Math.floor(r6 * 3)];
    const priority = jobType === "Emergency" ? "High" : (r7 > 0.66 ? "High" : r7 > 0.33 ? "Medium" : "Low");
    const region = REGIONS[Math.floor(r4 * REGIONS.length)];
    const status = r8 > 0.2 ? "Unscheduled" : "Scheduled";
    const daysAgo = Math.floor(r5 * 45);
    const created = new Date(REFERENCE_DATE);
    created.setDate(created.getDate() - daysAgo);
    list.push({
      id: "j" + (i + 1),
      jobNumber: "JOB-" + (10001 + i),
      jobType,
      client: prefix + " " + suffix,
      priority,
      region,
      status,
      createdISO: created.toISOString().slice(0, 10),
      created: fmtDate(created),
      daysAgo,
    });
  }
  return list;
}

function generateTechnicians(n) {
  const list = [];
  for (let i = 0; i < n; i++) {
    const first = TECH_FIRST[i % TECH_FIRST.length];
    const last = TECH_LAST[Math.floor(seededRand(i * 5.1) * TECH_LAST.length)];
    const region = REGIONS[Math.floor(seededRand(i * 9.3 + 1) * (REGIONS.length - 1))]; // bias away from West
    const skillCount = 1 + Math.floor(seededRand(i * 4.4 + 2) * 2);
    const skills = [...SKILL_POOL].sort(() => seededRand(i + skillCount) - 0.5).slice(0, skillCount);
    const team = TEAMS[Math.floor(seededRand(i * 6.6 + 3) * TEAMS.length)];
    const status = seededRand(i * 2.2 + 4) > 0.18 ? "Available" : "Busy";
    list.push({
      id: "t" + (i + 1),
      name: first + " " + last,
      region,
      team,
      skills,
      status,
      color: AVATAR_COLORS[i % AVATAR_COLORS.length],
    });
  }
  return list;
}

/* ---------------- pagination helper ---------------- */
function getPageNumbers(current, total) {
  const pages = [];
  if (total <= 7) {
    for (let i = 1; i <= total; i++) pages.push(i);
    return pages;
  }
  pages.push(1, 2, 3);
  if (current > 5) pages.push("...");
  const start = Math.max(4, current - 1);
  const end = Math.min(total - 3, current + 1);
  for (let i = start; i <= end; i++) if (!pages.includes(i)) pages.push(i);
  if (current < total - 4) pages.push("...");
  pages.push(total);
  return [...new Set(pages)];
}

function Pagination({ page, totalPages, onChange }) {
  const nums = getPageNumbers(page, totalPages);
  return (
    <div className="flex items-center gap-1">
      <button type="button" onClick={() => onChange(Math.max(1, page - 1))} disabled={page === 1}
        className="p-1 rounded text-slate-400 hover:text-slate-600 disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center">
        <ChevronLeftIcon size={16} />
      </button>
      {nums.map((n, i) => n === "..." ? (
        <span key={"e" + i} className="px-0.5 text-slate-400">...</span>
      ) : (
        <button type="button" key={n} onClick={() => onChange(n)}
          className={cx(
            "w-6 h-6 flex items-center justify-center font-medium rounded text-xs",
            n === page ? "border border-brand-600 text-brand-600 bg-emerald-50/50" : "hover:bg-slate-100 text-slate-600"
          )}>{n}</button>
      ))}
      <button type="button" onClick={() => onChange(Math.min(totalPages, page + 1))} disabled={page === totalPages}
        className="p-1 rounded text-slate-400 hover:text-slate-600 disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center">
        <ChevronRightIcon size={16} />
      </button>
    </div>
  );
}

                            <span className="inline-flex items-center gap-1.5 text-xs font-medium text-slate-700 whitespace-nowrap">
                              <span className={cx("w-1.5 h-1.5 rounded-full", t.status === "Available" ? "bg-emerald-600" : "bg-amber-500")}></span>
                              {t.status}
                            </span>
                          </td>
                        </tr>
                      ))}
                      {matchedTechs.length === 0 && (
                        <tr><td colSpan="5" className="py-4 px-3 text-center text-rose-500">No matching technicians found.</td></tr>
                      )}
                    </tbody>
                  </table>
                  </div>
                </div>
              </React.Fragment>
            )}

            {stage === "select" && (
              <div className="mt-4 pt-4 border-t border-slate-100">
                <button type="button" onClick={() => runOptimize()} disabled={!canRunPreview}
                  className={cx(
                    "w-full flex items-center justify-center gap-2 py-2.5 rounded-lg text-sm font-bold transition shadow-sm",
                    canRunPreview ? "bg-brand-700 hover:bg-brand-800 text-white shadow-emerald-900/10" : "bg-slate-100 text-slate-400 cursor-not-allowed"
                  )}>
                  <RocketIcon size={16} /> Optimize
                </button>
                {!canRunPreview && (
                  <p className="text-[11px] text-rose-500 mt-2">Select at least one client, a schedule date, and one technician to continue.</p>
                )}
              </div>
            )}
          </section>
        </div>
      </main>

      {/* ============ OPTIMIZING ============ */}
      {stage === "optimizing" && (
        <div className="mt-5 rounded-xl border border-slate-200 bg-white shadow-sm p-8 flex flex-col items-center gap-3">
          <LoaderIcon size={22} className="text-brand-600" />
          <p className="text-sm font-medium text-slate-700">Calculating routes and technician assignments...</p>
          <p className="text-xs text-slate-400">Evaluating {chosenRecords.length.toLocaleString()} record(s) · {selectedTechs.size} technician(s)</p>
        </div>
      )}

      {/* ============ OPTIMIZATION PREVIEW ============ */}
      {(stage === "preview" || stage === "done") && (
        <section className="mt-5 bg-white border border-slate-200 rounded-xl shadow-sm p-4 md:p-5 flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-base font-bold text-slate-900">Optimization Preview</h2>
            {stage === "done" && (
              <span className="inline-flex items-center gap-1.5 text-sm font-semibold text-brand-700">
                <CheckCircleIcon size={16} /> {finalAction === "dispatched" ? "Schedule & Dispatch complete" : "Schedule created"}
              </span>
            )}
          </div>

          <div className="grid grid-cols-12 gap-3 items-center">
            <div className="col-span-12 sm:col-span-4 space-y-2.5 pr-2">
              {[
                ["Selected Records", plan.length.toLocaleString()],
                ["Technicians", selectedTechs.size],
                ["Estimated Duration", estDurationDays + " days"],
                ["Total Distance", totalDistance + " km"],
                ["Total Visits", plan.length.toLocaleString()],
              ].map(([label, val]) => (
                <div key={label}>
                  <div className="text-[11px] font-medium text-slate-400 uppercase tracking-tight">{label}</div>
                  <div className="text-base font-bold text-slate-900">{val}</div>
                </div>
              ))}
            </div>
            <OptimizationMap />
          </div>

          {/* Plan table */}
          <div className="mt-4 border border-slate-200 rounded-lg overflow-hidden">
            <div className="max-h-[260px] overflow-y-auto">
              <table className="w-full text-left text-xs text-slate-600">
                <thead className="bg-slate-50 text-[11px] font-semibold text-slate-500 uppercase tracking-wider border-b border-slate-200 sticky top-0">
                  <tr>
                    <th className="py-2.5 px-3">#</th>
                    <th className="py-2.5 px-3">Client</th>
                    <th className="py-2.5 px-3">Technician</th>
                    <th className="py-2.5 px-3">Time</th>
                    <th className="py-2.5 px-3">Distance</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {plan.map((row) => (
                    <tr key={row.client.id}>
                      <td className="py-2 px-3 text-slate-500">{row.sequence}</td>
                      <td className="py-2 px-3 font-semibold text-slate-900 whitespace-nowrap">{row.client.name}</td>
                      <td className="py-2 px-3 text-slate-600 whitespace-nowrap">{row.tech.name}</td>
                      <td className="py-2 px-3 text-slate-600">{row.time}</td>
                      <td className="py-2 px-3 text-slate-600">{row.distanceKm} km</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          <div className="pt-4 flex justify-end gap-2.5">
            {stage === "preview" ? (
              <React.Fragment>
                <button type="button" onClick={() => finalize("scheduled")}
                  className="inline-flex items-center gap-2 px-4 py-1.5 text-xs sm:text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 shadow-sm transition">
                  <CalendarIcon size={15} className="text-emerald-600" /> Schedule
                </button>
                <button type="button" onClick={() => finalize("dispatched")}
                  className="inline-flex items-center gap-2 px-4 py-1.5 text-xs sm:text-sm font-medium text-white bg-brand-700 hover:bg-brand-800 rounded-lg shadow-sm transition shadow-emerald-900/10">
                  <DispatchIcon size={15} /> Schedule &amp; Dispatch
                </button>
              </React.Fragment>
            ) : (
              <button type="button" onClick={reset}
                className="inline-flex items-center gap-2 px-4 py-1.5 text-xs sm:text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 shadow-sm transition">
                <XIcon size={15} /> Start Over
              </button>
            )}
          </div>
        </section>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<BulkScheduleClient />);
</script>
</body>
</html>
